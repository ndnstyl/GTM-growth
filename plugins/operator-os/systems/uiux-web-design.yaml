domain: uiux-web-design
title: UI/UX Web Design
description: >
  Production frontend, landing pages, 3D web experiences, design-to-code, and web security audits.
  Anti-slop aesthetics, brand-palette discipline, and the static-export constraints of the Next.js
  site (auth via direct REST fetch, full rsync deploys, CF cache purge on new buildId).
autonomy: full_ship
gates: [prod_deploy, outward_send, db_migration]

brand_rules: []  # add your own rule names or short rule text

skills:
  primary: [frontend-design]
  support: [vibe-security]

agents: [orchestrator, implementer, reviewer]

n8n_workflows: []   # web design is not n8n-driven

memory_anchors: []  # add your own rule names or short rule text

verification:
  - "anti-slop production aesthetics; brand palette discipline (2-3 brand colors max)"
  - "static-export constraints honored: auth via direct REST fetch, full rsync deploy, CF purge on new buildId"
  - "immersion layer built global-first (Lenis vs pin conflict avoided)"
  - "no em dashes in copy; HTML entities use plain Unicode in attributes"

entrypoints:
  - "build a landing page for X"
  - "design a web experience / hero"
  - "convert this design to code"
  - "add a 3D section with Three.js / R3F"
  - "audit the web app for security"
  - "improve the UX of X page"
