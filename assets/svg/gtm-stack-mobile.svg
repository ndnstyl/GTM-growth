<rect width="420" height="1670" rx="18" fill="#12132a"/><rect x="1" y="1" width="418" height="1668" rx="17" fill="none" stroke="#00e5ff" stroke-opacity=".18"/><text class="t" x="28" y="58" font-size="24">The Growth Marketing + AI Stack</text><text class="m" x="28" y="90" font-size="15">Ten go-to-market folders, first touch to final</text><text class="m" x="28" y="110" font-size="15">report. Every item running in production</text><path d="M142.0,127.0 L142.0,183.0 L142.0,333.0 L142.0,483.0 L142.0,633.0 L142.0,783.0 L142.0,933.0 L142.0,1083.0 L142.0,1233.0 L142.0,1383.0 L142.0,1533.0" fill="none" stroke="#2a2c4a" stroke-width="2" stroke-dasharray="4 8"/><path d="M142.0,127.0 L142.0,183.0 L142.0,333.0 L142.0,483.0 L142.0,633.0 L142.0,783.0 L142.0,933.0 L142.0,1083.0 L142.0,1233.0 L142.0,1383.0 L142.0,1533.0" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" dur="27.50s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0327;0.0873;0.1200;0.1745;0.2073;0.2618;0.2945;0.3491;0.3818;0.4364;0.4691;0.5236;0.5564;0.6109;0.6436;0.6982;0.7309;0.7855;0.8182;0.8727;1" values="1.0000;0.9602;0.9602;0.8535;0.8535;0.7468;0.7468;0.6401;0.6401;0.5334;0.5334;0.4267;0.4267;0.3201;0.3201;0.2134;0.2134;0.1067;0.1067;0.0000;0.0000;0.0000"/></path><g transform="translate(28,150)"><path id="F0" class="fold" d="M7,10.56 L7,7 Q0,0 14,0 L26.96,0 Q34.96,0 40.96,6.336 L46.96,10.56 L85,10.56 Q92,10.56 92,17.560000000000002 L92,59 Q92,66 85,66 L7,66 Q0,66 0,59 L0,17.560000000000002 Q0,10.56 7,10.56 Z"/><rect id="L0" x="2" y="22.4" width="88" height="41.6" rx="6" fill="#12132a" opacity=".55"/><text class="num" x="80" y="52" text-anchor="end" font-size="22">01</text><text class="t" x="146" y="18" font-size="16">Market Research</text><g id="O0"><text x="146" y="45" font-size="13" fill="#a3a7c7">Every sales call becomes a</text><text x="146" y="63" font-size="13" fill="#a3a7c7">weekly read of objections,</text><text x="146" y="81" font-size="13" fill="#a3a7c7">strengths and competitors.</text></g></g><g transform="translate(28,300)"><path id="F1" class="fold" d="M7,10.56 L7,7 Q0,0 14,0 L26.96,0 Q34.96,0 40.96,6.336 L46.96,10.56 L85,10.56 Q92,10.56 92,17.560000000000002 L92,59 Q92,66 85,66 L7,66 Q0,66 0,59 L0,17.560000000000002 Q0,10.56 7,10.56 Z"/><rect id="L1" x="2" y="22.4" width="88" height="41.6" rx="6" fill="#12132a" opacity=".55"/><text class="num" x="80" y="52" text-anchor="end" font-size="22">02</text><text class="t" x="146" y="18" font-size="16">Positioning &amp; Offer</text><g id="O1"><text x="146" y="45" font-size="13" fill="#a3a7c7">Channel strategy, brand voice</text><text x="146" y="63" font-size="13" fill="#a3a7c7">and offer tests set before a</text><text x="146" y="81" font-size="13" fill="#a3a7c7">dollar is spent.</text></g></g><g transform="translate(28,450)"><path id="F2" class="fold" d="M7,10.56 L7,7 Q0,0 14,0 L26.96,0 Q34.96,0 40.96,6.336 L46.96,10.56 L85,10.56 Q92,10.56 92,17.560000000000002 L92,59 Q92,66 85,66 L7,66 Q0,66 0,59 L0,17.560000000000002 Q0,10.56 7,10.56 Z"/><rect id="L2" x="2" y="22.4" width="88" height="41.6" rx="6" fill="#12132a" opacity=".55"/><text class="num" x="80" y="52" text-anchor="end" font-size="22">03</text><text class="t" x="146" y="18" font-size="16">Content Engine</text><g id="O2"><text x="146" y="45" font-size="13" fill="#a3a7c7">One sentence in, finished</text><text x="146" y="63" font-size="13" fill="#a3a7c7">scripts and edited reels out,</text><text x="146" y="81" font-size="13" fill="#a3a7c7">on brand.</text></g></g><g transform="translate(28,600)"><path id="F3" class="fold" d="M7,10.56 L7,7 Q0,0 14,0 L26.96,0 Q34.96,0 40.96,6.336 L46.96,10.56 L85,10.56 Q92,10.56 92,17.560000000000002 L92,59 Q92,66 85,66 L7,66 Q0,66 0,59 L0,17.560000000000002 Q0,10.56 7,10.56 Z"/><rect id="L3" x="2" y="22.4" width="88" height="41.6" rx="6" fill="#12132a" opacity=".55"/><text class="num" x="80" y="52" text-anchor="end" font-size="22">04</text><text class="t" x="146" y="18" font-size="16">Paid Media</text><g id="O3"><text x="146" y="45" font-size="13" fill="#a3a7c7">Every platform&#x27;s results land</text><text x="146" y="63" font-size="13" fill="#a3a7c7">daily, and sales flow back so</text><text x="146" y="81" font-size="13" fill="#a3a7c7">ads optimize for revenue.</text></g></g><g transform="translate(28,750)"><path id="F4" class="fold" d="M7,10.56 L7,7 Q0,0 14,0 L26.96,0 Q34.96,0 40.96,6.336 L46.96,10.56 L85,10.56 Q92,10.56 92,17.560000000000002 L92,59 Q92,66 85,66 L7,66 Q0,66 0,59 L0,17.560000000000002 Q0,10.56 7,10.56 Z"/><rect id="L4" x="2" y="22.4" width="88" height="41.6" rx="6" fill="#12132a" opacity=".55"/><text class="num" x="80" y="52" text-anchor="end" font-size="22">05</text><text class="t" x="146" y="18" font-size="16">Capture &amp; Consent</text><g id="O4"><text x="146" y="45" font-size="13" fill="#a3a7c7">Every consent sealed with its</text><text x="146" y="63" font-size="13" fill="#a3a7c7">exact wording, provable on</text><text x="146" y="81" font-size="13" fill="#a3a7c7">demand.</text></g></g><g transform="translate(28,900)"><path id="F5" class="fold" d="M7,10.56 L7,7 Q0,0 14,0 L26.96,0 Q34.96,0 40.96,6.336 L46.96,10.56 L85,10.56 Q92,10.56 92,17.560000000000002 L92,59 Q92,66 85,66 L7,66 Q0,66 0,59 L0,17.560000000000002 Q0,10.56 7,10.56 Z"/><rect id="L5" x="2" y="22.4" width="88" height="41.6" rx="6" fill="#12132a" opacity=".55"/><text class="num" x="80" y="52" text-anchor="end" font-size="22">06</text><text class="t" x="146" y="18" font-size="16">Speed to Lead</text><g id="O5"><text x="146" y="45" font-size="13" fill="#a3a7c7">AI answers every call and</text><text x="146" y="63" font-size="13" fill="#a3a7c7">chat, routes it, and hands it</text><text x="146" y="81" font-size="13" fill="#a3a7c7">to a person.</text></g></g><g transform="translate(28,1050)"><path id="F6" class="fold" d="M7,10.56 L7,7 Q0,0 14,0 L26.96,0 Q34.96,0 40.96,6.336 L46.96,10.56 L85,10.56 Q92,10.56 92,17.560000000000002 L92,59 Q92,66 85,66 L7,66 Q0,66 0,59 L0,17.560000000000002 Q0,10.56 7,10.56 Z"/><rect id="L6" x="2" y="22.4" width="88" height="41.6" rx="6" fill="#12132a" opacity=".55"/><text class="num" x="80" y="52" text-anchor="end" font-size="22">07</text><text class="t" x="146" y="18" font-size="16">Sales Floor</text><g id="O6"><text x="146" y="45" font-size="13" fill="#a3a7c7">Every call transcribed and</text><text x="146" y="63" font-size="13" fill="#a3a7c7">scored daily, with training on</text><text x="146" y="81" font-size="13" fill="#a3a7c7">tap.</text></g></g><g transform="translate(28,1200)"><path id="F7" class="fold" d="M7,10.56 L7,7 Q0,0 14,0 L26.96,0 Q34.96,0 40.96,6.336 L46.96,10.56 L85,10.56 Q92,10.56 92,17.560000000000002 L92,59 Q92,66 85,66 L7,66 Q0,66 0,59 L0,17.560000000000002 Q0,10.56 7,10.56 Z"/><rect id="L7" x="2" y="22.4" width="88" height="41.6" rx="6" fill="#12132a" opacity=".55"/><text class="num" x="80" y="52" text-anchor="end" font-size="22">08</text><text class="t" x="146" y="18" font-size="16">Attribution &amp; Cost</text><g id="O7"><text x="146" y="45" font-size="13" fill="#a3a7c7">Every dollar of spend proven</text><text x="146" y="63" font-size="13" fill="#a3a7c7">before it reaches the CRM.</text></g></g><g transform="translate(28,1350)"><path id="F8" class="fold" d="M7,10.56 L7,7 Q0,0 14,0 L26.96,0 Q34.96,0 40.96,6.336 L46.96,10.56 L85,10.56 Q92,10.56 92,17.560000000000002 L92,59 Q92,66 85,66 L7,66 Q0,66 0,59 L0,17.560000000000002 Q0,10.56 7,10.56 Z"/><rect id="L8" x="2" y="22.4" width="88" height="41.6" rx="6" fill="#12132a" opacity=".55"/><text class="num" x="80" y="52" text-anchor="end" font-size="22">09</text><text class="t" x="146" y="18" font-size="16">Reporting Cockpit</text><g id="O8"><text x="146" y="45" font-size="13" fill="#a3a7c7">One screen where the numbers</text><text x="146" y="63" font-size="13" fill="#a3a7c7">refresh themselves and answer</text><text x="146" y="81" font-size="13" fill="#a3a7c7">back.</text></g></g><g transform="translate(28,1500)"><path id="F9" class="fold" d="M7,10.56 L7,7 Q0,0 14,0 L26.96,0 Q34.96,0 40.96,6.336 L46.96,10.56 L85,10.56 Q92,10.56 92,17.560000000000002 L92,59 Q92,66 85,66 L7,66 Q0,66 0,59 L0,17.560000000000002 Q0,10.56 7,10.56 Z"/><rect id="L9" x="2" y="22.4" width="88" height="41.6" rx="6" fill="#12132a" opacity=".55"/><text class="num" x="80" y="52" text-anchor="end" font-size="22">10</text><text class="t" x="146" y="18" font-size="16">Reliability</text><g id="O9"><text x="146" y="45" font-size="13" fill="#a3a7c7">Nothing fails quietly: jobs</text><text x="146" y="63" font-size="13" fill="#a3a7c7">heal, stall alarms fire, data</text><text x="146" y="81" font-size="13" fill="#a3a7c7">gates hold.</text></g></g><g><path d="M0,-11 L22,0 L0,11 L5,0 Z" fill="#00e5ff" stroke="#12132a" stroke-width="1.5"/><animateMotion dur="27.50s" repeatCount="indefinite" rotate="auto" calcMode="linear" keyPoints="0;0.0398;0.0398;0.1465;0.1465;0.2532;0.2532;0.3599;0.3599;0.4666;0.4666;0.5733;0.5733;0.6799;0.6799;0.7866;0.7866;0.8933;0.8933;1.0000;1.0000;1" keyTimes="0;0.0327;0.0873;0.1200;0.1745;0.2073;0.2618;0.2945;0.3491;0.3818;0.4364;0.4691;0.5236;0.5564;0.6109;0.6436;0.6982;0.7309;0.7855;0.8182;0.8727;1" path="M142.0,127.0 L142.0,183.0 L142.0,333.0 L142.0,483.0 L142.0,633.0 L142.0,783.0 L142.0,933.0 L142.0,1083.0 L142.0,1233.0 L142.0,1383.0 L142.0,1533.0"/></g></svg>