<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" role="img" aria-labelledby="mt md">
  <title id="mt">Operator OS architecture, stacked for a phone</title>
  <desc id="md">From top to bottom: you state a goal. A band of enforcement hooks surrounds a Claude Code session holding rules, skills, system packs and agents. Gates sit at the band's edge. Your own systems are behind the gates. A vault gives the session memory.</desc>
  <style>
    .bg{fill:var(--d-bg,#0b0c1a)}
    .t{fill:var(--d-ink,#f4f5fb);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    .m{fill:var(--d-mute,#aeb2cc);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    .a{fill:var(--d-acc,#00e5ff);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    .p{fill:var(--d-panel,#14162c);stroke:var(--d-edge,#3a3d63);stroke-width:1.5}
    .c{fill:var(--d-card,#1b1e3a);stroke:var(--d-edge,#3a3d63);stroke-width:1.2}
    .b{fill:var(--d-band,#0d2236);stroke:#00e5ff;stroke-width:2}
    .g{fill:#00e5ff}
    .gt{fill:#06101f;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-weight:700}
    .ar{stroke:var(--d-acc,#00e5ff);stroke-width:2;fill:none}
    .ah{fill:var(--d-acc,#00e5ff)}
  </style>
  <rect class="bg" width="360" height="760"/>
  <rect class="p" x="10" y="10" width="340" height="62" rx="10"/>
  <text class="t" x="24" y="36" font-size="17" font-weight="700">You</text>
  <text class="m" x="24" y="58" font-size="14">state a goal, read a result, hold the keys</text>
  <path class="ar" d="M180 72 V92"/><path class="ah" d="M174 90 l6 9 6 -9z"/>

  <rect class="b" x="10" y="100" width="340" height="360" rx="14"/>
  <text class="a" x="24" y="124" font-size="14" font-weight="700">ENFORCEMENT BAND</text>
  <text class="m" x="24" y="144" font-size="14">31 hooks check every tool call and ending</text>
  <rect class="p" x="22" y="156" width="316" height="292" rx="10"/>
  <text class="t" x="36" y="180" font-size="16" font-weight="700">Claude Code session</text>
  <rect class="c" x="34" y="192" width="292" height="50" rx="8"/>
  <text class="t" x="46" y="213" font-size="14" font-weight="700">Rules (18)</text>
  <text class="m" x="46" y="232" font-size="14">the doctrine, in plain markdown</text>
  <rect class="c" x="34" y="250" width="292" height="50" rx="8"/>
  <text class="t" x="46" y="271" font-size="14" font-weight="700">Skills (49)</text>
  <text class="m" x="46" y="290" font-size="14">methods you invoke by name</text>
  <rect class="c" x="34" y="308" width="292" height="50" rx="8"/>
  <text class="t" x="46" y="329" font-size="14" font-weight="700">System packs (8)</text>
  <text class="m" x="46" y="348" font-size="14">a domain tied to skills, agents, gates</text>
  <rect class="c" x="34" y="366" width="292" height="70" rx="8"/>
  <text class="t" x="46" y="387" font-size="14" font-weight="700">Agents (26)</text>
  <text class="m" x="46" y="406" font-size="14">one builds, a different one checks</text>
  <text class="m" x="46" y="425" font-size="14">reviewers are read-only</text>

  <rect class="g" x="22" y="468" width="100" height="30" rx="6"/><text class="gt" x="72" y="488" text-anchor="middle" font-size="12">WRITE GATE</text>
  <rect class="g" x="130" y="468" width="100" height="30" rx="6"/><text class="gt" x="180" y="488" text-anchor="middle" font-size="12">RATE GATE</text>
  <rect class="g" x="238" y="468" width="100" height="30" rx="6"/><text class="gt" x="288" y="488" text-anchor="middle" font-size="12">WATCH</text>
  <path class="ar" d="M180 498 V516"/><path class="ah" d="M174 514 l6 9 6 -9z"/>

  <rect class="p" x="10" y="528" width="340" height="104" rx="10" style="stroke-dasharray:6 5"/>
  <text class="t" x="24" y="554" font-size="16" font-weight="700">Your systems</text>
  <text class="m" x="24" y="574" font-size="14">reached only through gates</text>
  <text class="t" x="24" y="598" font-size="14">CRM, ad platforms, email and chat,</text>
  <text class="t" x="24" y="618" font-size="14">data warehouse, workflow server</text>

  <rect class="p" x="10" y="648" width="340" height="102" rx="10"/>
  <text class="t" x="24" y="674" font-size="16" font-weight="700">The vault</text>
  <text class="m" x="24" y="696" font-size="14">memory that outlives the session</text>
  <text class="a" x="24" y="718" font-size="14">recall in before work</text>
  <text class="a" x="24" y="738" font-size="14">learnings written back as it happens</text>
</svg>
